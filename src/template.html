<!doctype html>
<html lang="__LANG__" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <meta name="description" content="__DESC__">
  <meta name="author" content="__AUTHOR__">
  <meta name="theme-color" content="__THEME_COLOR__" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="__THEME_COLOR_DARK__" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="__TITLE__">
  <meta property="og:description" content="__DESC__">
  <meta property="og:url" content="__SITE_URL__">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="__ROOT__whale-head.png" type="image/png">
  <link rel="apple-touch-icon" href="__ROOT__whale-head.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="__CSS__">

  <script>
    window.__SITE__ = __CONFIG__;
    (function () {
      try {
        var stored = localStorage.getItem('waw-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* keep the light default */ }
    })();
  </script>
</head>
<body data-page="__PAGE__" data-depth="__DEPTH__">
  <div class="sky" aria-hidden="true"></div>
  <div class="whale-bg" aria-hidden="true">
    <img src="__ROOT__whale.png" alt="" decoding="async">
    <span class="whale-bg__pet" data-whale-pet></span>
  </div>
  <div class="whale-rain" aria-hidden="true"></div>
  <div class="bubbles" aria-hidden="true">
    <i style="left:8%;  width:14px; height:14px; animation-duration:26s; animation-delay:0s"></i>
    <i style="left:21%; width:9px;  height:9px;  animation-duration:33s; animation-delay:6s"></i>
    <i style="left:37%; width:18px; height:18px; animation-duration:41s; animation-delay:13s"></i>
    <i style="left:54%; width:11px; height:11px; animation-duration:29s; animation-delay:3s"></i>
    <i style="left:68%; width:7px;  height:7px;  animation-duration:37s; animation-delay:19s"></i>
    <i style="left:82%; width:15px; height:15px; animation-duration:45s; animation-delay:9s"></i>
    <i style="left:93%; width:10px; height:10px; animation-duration:31s; animation-delay:23s"></i>
  </div>

  <div id="site">
    <main class="initial">
      <p class="kicker">__KICKER__</p>
      <h1>在构建，也在记录。</h1>
      <p>页面正在加载…如果停留太久，可以直接访问 <a href="__GITHUB__">__GITHUB_LABEL__</a>。</p>
      <noscript>
        <p>这个站点用一点点 JavaScript 来渲染内容。请在浏览器设置里启用 JavaScript，或直接前往
          <a href="__GITHUB__">GitHub</a> 查看项目。</p>
      </noscript>
    </main>
  </div>

  <script>
    // If the module never runs (old browser, blocked request), show a real fallback instead of a dead page.
    setTimeout(function () {
      var el = document.querySelector('#site .initial p:last-of-type');
      if (el) el.textContent = '没能加载页面脚本，请检查网络后刷新。';
    }, 4000);
  </script>
  <script type="module" src="__JS__"></script>
</body>
</html>
